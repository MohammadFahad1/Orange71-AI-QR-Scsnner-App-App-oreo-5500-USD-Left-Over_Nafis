services:
  db:
    image: postgres:17-alpine
    container_name: orange71_db
    environment:
      POSTGRES_DB: orange71
      POSTGRES_USER: orange71
      POSTGRES_PASSWORD: orange71
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orange71 -d orange71"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: orange71_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: orange71_web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --clear &&
             daphne -b 0.0.0.0 -p 8000 orange71.asgi:application"
    volumes:
      - .:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    profiles: ["production"]
    image: nginx:alpine
    container_name: orange71_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/app
      - staticfiles:/app/staticfiles
      - media_files:/app/media
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  media_files:
  staticfiles:
